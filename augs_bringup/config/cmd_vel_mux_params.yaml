# cmd_vel_mux configuration for the augs Kobuki bringup.
#
# The mux republishes the active source (highest priority whose input has not
# timed out) on its hardcoded output /mux/output/cmd_vel, which the base
# subscribes to (via kobuki_node_mux.launch.py). Priority is an unsigned int;
# HIGHER wins. These params live in augs_bringup (not the base-image cmd_vel_mux
# package) so they deploy via bringup.Dockerfile without rebuilding the base image.
#
#   estop_hold (999) : orchestrator software e-stop — zeros; preempts everything
#   joystick   (10)  : teleop — preempts autonomy for manual override
#   navigation (1)   : Nav2 output, post velocity_smoother (its stock /cmd_vel)
#   default    (0)   : lowest-priority fallback
cmd_vel_mux:
  ros__parameters:
    subscribers:
        estop_hold:
          topic:       "mux/input/estop_hold"
          timeout:     0.3
          priority:    999
          short_desc:  "Orchestrator software e-stop: zeros while estopped, preempts all sources"

        teleop_joystick:
          topic:       "mux/input/joystick"
          timeout:     0.1
          priority:    10
          short_desc:  "Joystick teleop — preempts autonomy for manual override"

        navigation_stack:
          topic:       "/cmd_vel"
          timeout:     0.5
          priority:    1
          short_desc:  "Nav2 output (post velocity_smoother)"

        default_input:
          topic:       "mux/input/default"
          timeout:     0.1
          priority:    0
          short_desc:  "Lowest-priority fallback"
